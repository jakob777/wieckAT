<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibelreader</title>
  <style>
    :root {
      color-scheme: light;
      --border: #d7d7d7;
      --text: #202124;
      --muted: #666;
      --bg: #fff;
      --panel: #f7f7f7;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .reader {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      padding: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      background: var(--panel);
    }

    label {
      display: grid;
      gap: 6px;
      min-width: 160px;
      font-size: 14px;
      color: var(--muted);
    }

    select,
    button {
      min-height: 40px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .nav {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      line-height: 1.25;
    }

    .verse {
      margin: 0 0 10px;
      line-height: 1.7;
    }

    .verse sup {
      display: inline-block;
      min-width: 2.4em;
      padding-right: 0.35em;
      color: var(--muted);
      font-size: 0.75em;
      line-height: 1;
    }

    .status {
      color: var(--muted);
    }

    @media (max-width: 620px) {
      .controls,
      .nav {
        display: grid;
      }

      label,
      select,
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="reader">
    <form class="controls" id="controls">
      <label>
        Buch
        <select id="book"></select>
      </label>
      <label>
        Kapitel
        <select id="chapter"></select>
      </label>
      <div class="nav">
        <button type="button" id="prev">Zurück</button>
        <button type="button" id="next">Weiter</button>
      </div>
    </form>

    <section id="content">
      <p class="status">Lade Bibeltext ...</p>
    </section>
  </main>

  <script>
    const DATA_URL = 'bible_verses.json';
    const bookSelect = document.getElementById('book');
    const chapterSelect = document.getElementById('chapter');
    const content = document.getElementById('content');
    const prevButton = document.getElementById('prev');
    const nextButton = document.getElementById('next');

    let verses = [];
    let books = [];
    let chaptersByBook = new Map();

    function key(book, chapter) {
      return `${book}:${chapter}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function buildIndex() {
      const seenBooks = new Set();
      const chapterSets = new Map();

      verses.forEach((verse) => {
        if (!seenBooks.has(verse.book)) {
          seenBooks.add(verse.book);
          books.push({ code: verse.book, name: verse.book_name || verse.book });
        }
        if (!chapterSets.has(verse.book)) {
          chapterSets.set(verse.book, new Set());
        }
        chapterSets.get(verse.book).add(verse.chapter);
      });

      chapterSets.forEach((set, book) => {
        chaptersByBook.set(book, Array.from(set).sort((a, b) => a - b));
      });
    }

    function fillBooks() {
      bookSelect.innerHTML = books.map((book) => (
        `<option value="${escapeHtml(book.code)}">${escapeHtml(book.name)}</option>`
      )).join('');
    }

    function fillChapters(book, selectedChapter) {
      const chapters = chaptersByBook.get(book) || [];
      chapterSelect.innerHTML = chapters.map((chapter) => (
        `<option value="${chapter}" ${chapter === selectedChapter ? 'selected' : ''}>${chapter}</option>`
      )).join('');
    }

    function currentLocation() {
      return {
        book: bookSelect.value,
        chapter: Number(chapterSelect.value),
      };
    }

    function setLocation(book, chapter, push = true) {
      bookSelect.value = book;
      fillChapters(book, chapter);
      render();
      if (push) {
        const params = new URLSearchParams({ book, chapter: String(chapter) });
        history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
      }
    }

    function chapterOrder() {
      const out = [];
      books.forEach((book) => {
        (chaptersByBook.get(book.code) || []).forEach((chapter) => {
          out.push({ book: book.code, chapter });
        });
      });
      return out;
    }

    function move(delta) {
      const order = chapterOrder();
      const current = currentLocation();
      const index = order.findIndex((item) => item.book === current.book && item.chapter === current.chapter);
      const next = order[index + delta];
      if (next) {
        setLocation(next.book, next.chapter);
      }
    }

    function render() {
      const current = currentLocation();
      const chapterVerses = verses.filter((verse) => verse.book === current.book && verse.chapter === current.chapter);
      if (!chapterVerses.length) {
        content.innerHTML = '<p class="status">Keine Verse gefunden.</p>';
        return;
      }

      const title = `${chapterVerses[0].book_name || current.book} ${current.chapter}`;
      content.innerHTML = `
        <h1>${escapeHtml(title)}</h1>
        ${chapterVerses.map((verse) => `
          <p class="verse" id="${escapeHtml(verse.book.toLowerCase())}-${verse.chapter}-${verse.verse}">
            <sup>${verse.verse}</sup><span>${escapeHtml(verse.text)}</span>
          </p>
        `).join('')}
      `;
    }

    bookSelect.addEventListener('change', () => {
      const chapters = chaptersByBook.get(bookSelect.value) || [1];
      setLocation(bookSelect.value, chapters[0]);
    });

    chapterSelect.addEventListener('change', () => {
      setLocation(bookSelect.value, Number(chapterSelect.value));
    });

    prevButton.addEventListener('click', () => move(-1));
    nextButton.addEventListener('click', () => move(1));

    fetch(DATA_URL)
      .then((response) => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
      })
      .then((data) => {
        verses = data;
        buildIndex();
        fillBooks();

        const params = new URLSearchParams(location.search);
        const requestedBook = params.get('book');
        const requestedChapter = Number(params.get('chapter'));
        const initialBook = books.some((book) => book.code === requestedBook) ? requestedBook : books[0].code;
        const chapters = chaptersByBook.get(initialBook) || [1];
        const initialChapter = chapters.includes(requestedChapter) ? requestedChapter : chapters[0];
        setLocation(initialBook, initialChapter, false);
      })
      .catch((error) => {
        content.innerHTML = `<p class="status">Konnte ${escapeHtml(DATA_URL)} nicht laden: ${escapeHtml(error.message)}</p>`;
      });
  </script>
</body>
</html>
